[project]
name = "openwebui-plugins"
version = "0.1.0"
description = "Monorepo for Open WebUI plugins"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["plugins/*"]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pydantic>=2",
    "beautifulsoup4>=4",
    "pre-commit>=4.6.1",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "plugins"]
markers = [
    "integration: marks tests that require a running Open WebUI container",
    "unit: marks tests that do not require a container",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
