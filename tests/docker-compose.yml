services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "${OWUI_PORT:-3000}:8080"
    environment:
      WEBUI_SECRET_KEY: owui-test-secret-key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - owui-test-data:/app/backend/data

volumes:
  owui-test-data:
