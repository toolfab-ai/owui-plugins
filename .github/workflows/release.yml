name: Release

on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PLUGIN="${TAG%/*}"
          VERSION="${TAG#*/}"
          VERSION="${VERSION#v}"
          echo "plugin=$PLUGIN" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_ENV
          
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_ENV
            {
              echo "status_note<<EOF"
              echo "> [!CAUTION]"
              echo "> **PRE-RELEASE**: This version is for testing and preview purposes only. It is not recommended for production environments."
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "is_prerelease=false" >> $GITHUB_ENV
            echo "status_note=" >> $GITHUB_ENV
          fi

      - name: Validate plugin exists
        run: test -d "plugins/${{ env.plugin }}"

      - name: Build plugin
        run: uv run python "plugins/${{ env.plugin }}/build.py" "${{ env.version }}" --skip-tests

      - name: Generate release body
        id: body
        run: uv run python scripts/prepare_release.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
            name: "${{ env.plugin }} v${{ env.version }}"
            tag_name: ${{ github.ref_name }}
            body: ${{ steps.body.outputs.body }}
            files: |
              plugins/${{ env.plugin }}/plugin.py
              plugins/${{ env.plugin }}/README.md
            generate_release_notes: false
            prerelease: ${{ env.is_prerelease == 'true' }}
