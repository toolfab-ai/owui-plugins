name: Release

on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PLUGIN="${TAG%/*}"
          VERSION="${TAG#*/}"
          VERSION="${VERSION#v}"
          echo "plugin=$PLUGIN" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_ENV
          
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_ENV
            echo "status_note=> [!CAUTION]\n> **PRE-RELEASE**: This version is for testing and preview purposes only. It is not recommended for production environments." >> $GITHUB_ENV
          else
            echo "is_prerelease=false" >> $GITHUB_ENV
            echo "status_note=" >> $GITHUB_ENV
          fi

      - name: Validate plugin exists
        run: test -d "plugins/${{ env.plugin }}" || { echo "Plugin not found: ${{ env.plugin }}"; exit 1; }

      - name: Build plugin
        run: uv run python "plugins/${{ env.plugin }}/build.py" "${{ env.version }}"

      - name: Generate release body
        id: body
        shell: python
        run: |
            import os
            import re
            import sys
            from pathlib import Path

            plugin = os.environ["plugin"]
            version = os.environ["version"]
            
            # 1. Extract Changelog
            changelog_path = Path(f"plugins/{plugin}/CHANGELOG.md")
            if not changelog_path.exists():
                print(f"::error::Missing CHANGELOG.md for plugin {plugin}")
                sys.exit(1)

            changelog_content = changelog_path.read_text(encoding="utf-8")
            
            # Match ## [version] - date ... until next ## or EOF
            # Supports both ## [1.0.0] and ## [1.0.0] - 2024-01-01
            pattern = rf"## \[{re.escape(version)}\](?: - \d{{4}}-\d{{2}}-\d{{2}})?\n(.*?)(?=\n## \[|\Z)"
            match = re.search(pattern, changelog_content, re.DOTALL)

            if not match or not match.group(1).strip():
                print(f"::error::Version {version} entry not found or empty in {plugin}/CHANGELOG.md")
                sys.exit(1)

            changelog_text = match.group(1).strip()

            # 2. Prepare Template
            template_path = Path("scripts/release_template.md")
            if not template_path.exists():
                print(f"::error::Missing scripts/release_template.md")
                sys.exit(1)
            
            template = template_path.read_text(encoding="utf-8")
            
            values = {
                "{plugin}": plugin,
                "{version}": version,
                "{repo}": os.environ["GITHUB_REPOSITORY"],
                "{tag}": os.environ["tag"],
                "{status_note}": os.environ.get("status_note", "").replace("\\n", "\n"),
                "{changelog}": changelog_text
            }
            
            body = template
            for placeholder, value in values.items():
                body = body.replace(placeholder, value)
            
            # 3. Set output
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                f.write("body<<EOF\n")
                f.write(body + "\n")
                f.write("EOF\n")

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
            name: "${{ env.plugin }} v${{ env.version }}"
            tag_name: ${{ github.ref_name }}
            body: ${{ steps.body.outputs.body }}
            files: plugins/${{ env.plugin }}/plugin.py
            generate_release_notes: false
            prerelease: ${{ env.is_prerelease == 'true' }}
