name: CI

on:
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  validate-builds:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Validate plugin builds
        run: |
          for plugin in plugins/*/build.py; do
            dir=$(dirname "$plugin")
            echo "Checking $dir..."
            uv run python "$plugin" --check
          done

  unit-tests:
    needs: validate-builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Run unit tests
        run: uv run pytest -m unit -x

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Pre-pull Open WebUI image
        run: docker pull ghcr.io/open-webui/open-webui:main
      - name: Run integration tests
        run: uv run pytest -m integration -x
      - name: Cleanup
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v
